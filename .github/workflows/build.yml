name: Build and test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev libsqlite3-dev libxml2-dev libzip-dev dpkg-dev file
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Package and check installation
        working-directory: build
        run: |
          cpack -G DEB
          sudo apt-get install -y ./docsmanager_*.deb
          /usr/bin/docsManager --version
          QT_QPA_PLATFORM=offscreen ./tests/startup_tests /usr/bin/docsManager
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docsmanager-ubuntu-24.04
          path: build/docsmanager_*.deb
          if-no-files-found: error
